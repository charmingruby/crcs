# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  lint:
    desc: Runs linter
    cmds:
      - go fmt ./...
      - golangci-lint run ./...
  lint:fix:
    desc: Runs linter with auto-fix
    cmds:
      - go fmt ./...
      - golangci-lint run --fix ./...
  test:
    desc: Runs tests
    cmd: go test ./... -race
