# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  MIGRATIONS_PATH: "./db/migration"
  DATABASE_URL: "postgres://postgres:postgres@localhost:5432/lab?sslmode=disable"

tasks:
  build:
    desc: Builds all workspace modules
    cmds:
      - go build ./pkg/core/... ./pkg/event/... ./pkg/platform/... ./services/api/... ./services/worker/... ./services/outbox/...
  test:
    desc: Tests all workspace modules (integration tests use TEST_DATABASE_URL)
    cmds:
      - go test -race ./pkg/core/... ./pkg/event/... ./pkg/platform/... ./services/api/... ./services/worker/... ./services/outbox/...
  test:async:
    desc: Runs asynchronous processing regression tests
    cmd: go test -race ./services/worker/test/... ./services/api/internal/shared/outbox/... ./services/outbox/test/... {{.CLI_ARGS}}
  outbox:
    desc: Runs the outbox service
    cmd: go run ./services/outbox/cmd/outbox
  mig:up:
    desc: Runs the migrations up
    cmd: migrate -path {{.MIGRATIONS_PATH}} -database "{{.DATABASE_URL}}" up
    silent: true
  mig:down:
    desc: Runs the migrations down
    cmd: migrate -path {{.MIGRATIONS_PATH}} -database "{{.DATABASE_URL}}" down
    silent: true
  mig:new:
    desc: Creates a new migration
    cmd: migrate create -ext sql -dir {{.MIGRATIONS_PATH}} -seq {{.name}}
    silent: true
  compose:
    desc: Runs `docker compose up -d`
    cmd: docker compose up -d
