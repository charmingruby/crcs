# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  default:
    desc: Run application locally with hot-reload
    cmds:
      - go mod tidy
      - air
    silent: true
  lint:
    desc: Runs linter
    cmds:
      - go fmt ./...
      - golangci-lint run ./...
  lint:fix:
    desc: Runs linter with auto-fix
    cmds:
      - go fmt ./...
      - golangci-lint run --fix ./...
  test:
    desc: Runs tests
    cmd: go test ./... -race
  build:
    desc: Builds API binary
    cmd: go build -ldflags="-s -w" -trimpath -o bin/api ./cmd/api
